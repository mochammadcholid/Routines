<!DOCTYPE html>
<html lang="id">
<head>

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Routines" />
  <meta name="description" content="Routines — Aplikasi Tilawah, Tasbih Digital Privat, dan Kalender Masehi-Hijriyah-Jawa bergaya Material You" />
  <title>Routines — Tilawah, Tasbih & Kalender</title>

  <link id="dynamicAppleIcon" rel="apple-touch-icon" href="" />
  <link id="dynamicManifest" rel="manifest" href="" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --md-primary: #246B53;
      --md-on-primary: #FFFFFF;
      --md-primary-container: #B7F0D6;
      --md-on-primary-container: #002116;
      --md-secondary-container: #D4E8DD;
      --md-on-secondary-container: #0F1F18;
      --md-tertiary-container: #DCE5F5;
      --md-on-tertiary-container: #121D2E;
      --md-bg: #F4F8F5;
      --md-surface: #FFFFFF;
      --md-surface-container: #E7EFEA;
      --md-surface-container-high: #DCE7E0;
      --md-text: #141D19;
      --md-text-muted: #4A5952;
      --md-outline: #BCC9C1;
      --tasbih-dot: rgba(0, 0, 0, 0.06);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--md-bg);
      color: var(--md-text);
      margin: 0;
      padding: 0;
      transition: background-color 0.25s ease, color 0.25s ease;
      overflow-x: hidden;
      user-select: none;
    }

    .font-arab {
      font-family: 'Amiri', serif;
    }

    .tasbih-dotted-bg {
      background-image: radial-gradient(var(--tasbih-dot) 1.3px, transparent 1.3px);
      background-size: 16px 16px;
    }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-thumb { background: var(--md-outline); border-radius: 9999px; }

    /* =========================================================================
       MATERIAL MOTION ANIMATIONS
       ========================================================================= */
    @keyframes mdPageEnter {
      0% { opacity: 0; transform: translateY(10px) scale(0.99); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    .md-page-enter {
      animation: mdPageEnter 0.3s cubic-bezier(0.2, 0.9, 0.2, 1) forwards;
    }

    @keyframes mdNumberBounce {
      0% { transform: scale(1); }
      35% { transform: scale(1.16); }
      70% { transform: scale(0.96); }
      100% { transform: scale(1); }
    }
    .md-num-bounce {
      animation: mdNumberBounce 0.34s cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes mdPopIn {
      0% { transform: scale(0.72); }
      60% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }
    .md-pop-in {
      animation: mdPopIn 0.3s cubic-bezier(0.2, 0.9, 0.3, 1);
    }

    @keyframes mdRippleWave {
      0% { transform: translate(-50%, -50%) scale(0.2); opacity: 0.45; }
      100% { transform: translate(-50%, -50%) scale(2.8); opacity: 0; }
    }
    .md-ripple-wave {
      position: absolute;
      width: 110px;
      height: 110px;
      border-radius: 9999px;
      background: radial-gradient(circle, var(--md-primary) 0%, transparent 72%);
      pointer-events: none;
      animation: mdRippleWave 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .stealth-oled .md-ripple-wave {
      opacity: 0.12 !important;
      animation-duration: 0.35s;
    }

    .nav-pill svg, .nav-pill span, .side-nav-item span {
      transition: transform 0.25s cubic-bezier(0.2, 0.9, 0.3, 1);
    }
    .bot-nav-item[data-active="true"] .nav-pill svg,
    .bot-nav-item[data-active="true"] .nav-pill span {
      transform: scale(1.12);
    }
    .side-nav-item[data-active="true"] span:first-child {
      transform: scale(1.12);
    }
  </style>
</head>
<body class="min-h-screen">

  <!-- Layout Utama Responsif -->

         SIDEBAR NAVIGASI (TABLET & DESKTOP md:flex)

         MAIN VIEWPORT CONTENT

    <div class="flex-1 flex flex-col w-full max-w-2xl mx-auto min-h-screen">

    // =========================================================================
    // 3. GENERATOR WARNA MATERIAL YOU DINAMIS
    // =========================================================================
    function hexToHsl(hex) {
      let c = hex.replace('#', '');
      if (c.length === 3) c = c.split('').map(x => x + x).join('');
      const r = parseInt(c.substring(0, 2), 16) / 255;
      const g = parseInt(c.substring(2, 4), 16) / 255;
      const b = parseInt(c.substring(4, 6), 16) / 255;
      const max = Math.max(r, g, b), min = Math.min(r, g, b);
      let h = 0, s = 0, l = (max + min) / 2;
      if (max !== min) {
        const d = max - min;
        s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
        switch (max) {
          case r: h = (g - b) / d + (g < b ? 6 : 0); break;
          case g: h = (b - r) / d + 2; break;
          case b: h = (r - g) / d + 4; break;
        }
        h /= 6;
      }
      return { h: Math.round(h * 360), s: Math.round(s * 100), l: Math.round(l * 100) };
    }

    function hslStr(h, s, l) {
      return `hsl(${((h % 360) + 360) % 360}, ${Math.max(0, Math.min(100, s))}%, ${Math.max(0, Math.min(100, l))}%)`;
    }

    function applyMaterialTheme() {
      const root = document.documentElement;
      const { h, s } = hexToHsl(state.accentColor);
      const sat = Math.max(22, Math.min(72, s));
      const isStealthTasbih = state.activeTab === 'tasbih' && state.tasbih.stealthBlack;
      const mode = isStealthTasbih ? 'trueBlack' : state.themeMode;

      let tokens = {};

      if (mode === 'light') {
        tokens = {
          primary: hslStr(h, sat, 32),
          onPrimary: '#FFFFFF',
          primaryContainer: hslStr(h, Math.min(80, sat + 10), 90),
          onPrimaryContainer: hslStr(h, sat, 12),
          secondaryContainer: hslStr(h, 24, 88),
          onSecondaryContainer: hslStr(h, 24, 15),
          tertiaryContainer: hslStr(h + 38, 35, 90),
          onTertiaryContainer: hslStr(h + 38, 35, 16),
          bg: hslStr(h, 16, 97),
          surface: '#FFFFFF',
          surfaceContainer: hslStr(h, 16, 93),
          surfaceContainerHigh: hslStr(h, 18, 88),
          text: hslStr(h, 18, 11),
          textMuted: hslStr(h, 12, 38),
          outline: hslStr(h, 14, 78),
          dot: 'rgba(0,0,0,0.06)'
        };
      } else if (mode === 'dark') {
        tokens = {
          primary: hslStr(h, Math.min(85, sat + 12), 76),
          onPrimary: hslStr(h, sat, 15),
          primaryContainer: hslStr(h, sat, 24),
          onPrimaryContainer: hslStr(h, Math.min(85, sat + 10), 92),
          secondaryContainer: hslStr(h, 20, 22),
          onSecondaryContainer: hslStr(h, 20, 90),
          tertiaryContainer: hslStr(h + 38, 28, 24),
          onTertiaryContainer: hslStr(h + 38, 30, 90),
          bg: hslStr(h, 14, 9),
          surface: hslStr(h, 14, 13),
          surfaceContainer: hslStr(h, 14, 18),
          surfaceContainerHigh: hslStr(h, 14, 23),
          text: hslStr(h, 12, 93),
          textMuted: hslStr(h, 10, 68),
          outline: hslStr(h, 12, 30),
          dot: 'rgba(255,255,255,0.06)'
        };
      } else {
        tokens = {
          primary: isStealthTasbih ? '#52606D' : hslStr(h, Math.min(80, sat + 8), 68),
          onPrimary: '#000000',
          primaryContainer: '#111315',
          onPrimaryContainer: '#D4DCE2',
          secondaryContainer: '#121212',
          onSecondaryContainer: '#C8C8C8',
          tertiaryContainer: '#14171A',
          onTertiaryContainer: '#CBD5E1',
          bg: '#000000',
          surface: '#070708',
          surfaceContainer: '#111113',
          surfaceContainerHigh: '#18181B',
          text: isStealthTasbih ? '#71717A' : '#E4E4E7',
          textMuted: '#52525B',
          outline: '#1F1F23',
          dot: 'rgba(255,255,255,0.025)'
        };
      }

      currentThemeTokens = tokens;

      root.style.setProperty('--md-primary', tokens.primary);
      root.style.setProperty('--md-on-primary', tokens.onPrimary);
      root.style.setProperty('--md-primary-container', tokens.primaryContainer);
      root.style.setProperty('--md-on-primary-container', tokens.onPrimaryContainer);
      root.style.setProperty('--md-secondary-container', tokens.secondaryContainer);
      root.style.setProperty('--md-on-secondary-container', tokens.onSecondaryContainer);
      root.style.setProperty('--md-tertiary-container', tokens.tertiaryContainer);
      root.style.setProperty('--md-on-tertiary-container', tokens.onTertiaryContainer);
      root.style.setProperty('--md-bg', tokens.bg);
      root.style.setProperty('--md-surface', tokens.surface);
      root.style.setProperty('--md-surface-container', tokens.surfaceContainer);
      root.style.setProperty('--md-surface-container-high', tokens.surfaceContainerHigh);
      root.style.setProperty('--md-text', tokens.text);
      root.style.setProperty('--md-text-muted', tokens.textMuted);
      root.style.setProperty('--md-outline', tokens.outline);
      root.style.setProperty('--tasbih-dot', tokens.dot);

      const metaTheme = document.querySelector('meta[name="theme-color"]');
      if (metaTheme) metaTheme.setAttribute('content', mode === 'trueBlack' ? '#000000' : tokens.primary);

      const topBar = document.getElementById('mobileTopBar');
      if (topBar) {
        if (isStealthTasbih) {
          topBar.classList.add('hidden');
        } else {

        }

    function downloadDynamicPngIcon(size = 512) {
      const svgStr = generateRoutinesAppIconSVG(size);
      const img = new Image();
      const svgBlob = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(svgBlob);
      img.onload = function () {
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, size, size);
        URL.revokeObjectURL(url);
        canvas.toBlob(function (pngBlob) {
          const pngUrl = URL.createObjectURL(pngBlob);
          const a = document.createElement('a');
          a.href = pngUrl;
          a.download = `icon-${size}.png`;
          a.click();
          URL.revokeObjectURL(pngUrl);
          showToast(`Ikon adaptif icon-${size}.png diunduh!`);
        }, 'image/png');
      };
      img.src = url;
    }

    function setTilawahUnit(unit) {
      state.tilawah.unit = unit;
      saveState();
      renderApp();

    function updateTodayRead(dir) {
      const step = state.tilawah.unit === 'juz' ? 20 : 1;
      const delta = dir * step;
      const newToday = Math.max(0, state.tilawah.todayPages + delta);
      const actualDiff = newToday - state.tilawah.todayPages;

      state.tilawah.todayPages = newToday;
      state.tilawah.totalPages = Math.min(604, Math.max(0, state.tilawah.totalPages + actualDiff));
      state.tilawah.juzNum = Math.min(30, Math.max(1, Math.ceil(state.tilawah.totalPages / 20) || 1));

      if (state.tilawah.todayPages >= state.tilawah.dailyTarget) {
        state.tilawah.weeklyCheck[6] = true;
      }
      saveState();
      renderApp(false);
      triggerElementAnimation('tilawahCounterVal', 'md-num-bounce');
      triggerElementAnimation('tilawahPctBadge', 'md-pop-in');
    }

    function updateDailyTarget(delta) {
      state.tilawah.dailyTarget = Math.max(1, state.tilawah.dailyTarget + delta);
      saveState();
      renderApp(false);
    }

    function toggleDayCheck(idx) {
      state.tilawah.weeklyCheck[idx] = !state.tilawah.weeklyCheck[idx];
      saveState();
      renderApp(false);
      if (state.tilawah.weeklyCheck[idx]) {
        triggerElementAnimation(`dayCheck-${idx}`, 'md-pop-in');
      }
    }

    function toggleHaidMode() {
      state.tilawah.haidMode = !state.tilawah.haidMode;
      saveState();
      renderApp(false);
      showToast(state.tilawah.haidMode ? 'Mode Jeda Haid diaktifkan' : 'Mode Tilawah normal aktif');
    }

    function confirmResetTilawah() {
      state.tilawah.todayPages = 0;
      state.tilawah.weeklyCheck[6] = false;
      saveState();
      renderApp(false);
      showToast('Hitungan bacaan hari ini di-reset ke 0');
    }

                <div class="text-[9px] font-semibold" style="color: var(--md-text-muted);">Stopwatch</div>
              </div>
              <button onclick="resetStopwatch()" class="text-sm font-bold opacity-70 hover:opacity-100 active:scale-90" title="Reset Stopwatch">

                 style="background-color: var(--md-surface); border-color: var(--md-outline);">

    function handleTasbihScreenTap(e) {
      if (e.target.closest('button')) return;
      incrementTasbih(e);
    }

    function spawnTasbihRipple(e) {
      const screen = document.getElementById('tasbihScreen');
      const layer = document.getElementById('tasbihRippleLayer');
      if (!screen || !layer) return;

      const rect = screen.getBoundingClientRect();
      let x = rect.width / 2;
      let y = rect.height / 2;

      if (e && typeof e.clientX === 'number' && e.clientX > 0) {
        x = e.clientX - rect.left;
        y = e.clientY - rect.top;
      }

      const wave = document.createElement('span');
      wave.className = 'md-ripple-wave';
      wave.style.left = `${x}px`;
      wave.style.top = `${y}px`;
      layer.appendChild(wave);
      setTimeout(() => wave.remove(), 600);
    }

    function incrementTasbih(e) {
      if (e) e.stopPropagation();
      const ts = state.tasbih;
      ts.count += 1;
      ts.total += 1;

      if (ts.vibrate && navigator.vibrate) {
        navigator.vibrate(25);
      }

      if (ts.count >= ts.target) {
        ts.rounds += 1;
        if (ts.vibrate && navigator.vibrate) {
          navigator.vibrate([70, 50, 70]);
        }
        showToast(`Putaran ke-${ts.rounds} selesai (${ts.target}x)`);
        ts.count = 0;
      }

      saveState();
      renderApp(false);
      spawnTasbihRipple(e);
      triggerElementAnimation('tasbihCountNum', 'md-num-bounce');
    }

    function decrementTasbih() {
      if (state.tasbih.count > 0) {
        state.tasbih.count -= 1;
        state.tasbih.total = Math.max(0, state.tasbih.total - 1);
        saveState();
        renderApp();
      }
    }

      state.tasbih.count = 0;
      saveState();

      showToast('Hitungan putaran di-reset');

      state.tasbih.vibrate = !state.tasbih.vibrate;

      state.tasbih.stealthBlack = !state.tasbih.stealthBlack;

      applyMaterialTheme();
      renderApp();
      showToast(state.tasbih.stealthBlack ? 'Mode Hitam Pekat OLED aktif' : 'Kembali ke tema normal');

    function toggleStopwatch() {
      if (swRunning) {
        clearInterval(swInterval);
        swRunning = false;
      } else {
        swRunning = true;
        swInterval = setInterval(() => {
          swSeconds += 1;
          if (state.activeTab === 'tasbih') renderApp();
        }, 1000);
      }
      renderApp();
    }

    function resetStopwatch() {
      clearInterval(swInterval);
      swRunning = false;
      swSeconds = 0;
      renderApp();

    // =========================================================================
    // 8. TAB 3: KALENDER LENGKAP (MASEHI, HIJRIYAH, PASARAN JAWA & HARI PENTING)
    // =========================================================================
    function getPasaranJawa(dateObj) {
      const utc1 = Date.UTC(1970, 0, 1);
      const utc2 = Date.UTC(dateObj.getFullYear(), dateObj.getMonth(), dateObj.getDate());
      const diffDays = Math.floor((utc2 - utc1) / 86400000);
      const idx = ((diffDays + 3) % 5 + 5) % 5;
      return PASARAN_JAWA[idx];
    }

    function getHijriDate(dateObj) {
      const adj = new Date(dateObj.getFullYear(), dateObj.getMonth(), dateObj.getDate() + 1);
      const d = adj.getDate();
      const m = adj.getMonth() + 1;
      const y = adj.getFullYear();

      let jd = Math.floor((1461 * (y + 4800 + Math.floor((m - 14) / 12))) / 4) +
               Math.floor((367 * (m - 2 - 12 * Math.floor((m - 14) / 12))) / 12) -
               Math.floor((3 * Math.floor((y + 4900 + Math.floor((m - 14) / 12)) / 100)) / 4) +
               d - 32075;

      let l = jd - 1948440 + 10632;
      let n = Math.floor((l - 1) / 10631);
      l = l - 10631 * n + 354;
      let j = (Math.floor((10985 - l) / 5316)) * (Math.floor((50 * l) / 17719)) +
              (Math.floor(l / 5670)) * (Math.floor((43 * l) / 15238));
      l = l - (Math.floor((30 - j) / 15)) * (Math.floor((17719 * j) / 50)) -
          (Math.floor(j / 16)) * (Math.floor((15238 * j) / 43)) + 29;
      let hMonth = Math.floor((24 * l) / 709);
      let hDay = l - Math.floor((709 * hMonth) / 24);
      let hYear = 30 * n + j - 30;

      return {
        day: hDay,
        month: hMonth,
        monthName: HIJRI_MONTHS[hMonth - 1] || 'Muharram',
        year: hYear
      };
    }

    function getDateEvents(dateObj, hijri) {
      const events = [];
      const mMonth = dateObj.getMonth() + 1;
      const mDay = dateObj.getDate();
      const dow = dateObj.getDay();

      ISLAMIC_EVENTS.forEach(ev => {
        if (ev.month === hijri.month && ev.day === hijri.day) {
          events.push({ title: ev.title, type: ev.type, priority: true });
        }
      });

      NATIONAL_HOLIDAYS.forEach(nh => {
        if (nh.month === mMonth && nh.day === mDay) {
          events.push({ title: nh.title, type: 'nasional', priority: true });
        }
      });

      if ((hijri.day === 13 || hijri.day === 14 || hijri.day === 15) && !(hijri.month === 12 && hijri.day === 13)) {
        events.push({ title: `Puasa Sunnah Ayyamul Bidh (${hijri.day} ${hijri.monthName})`, type: 'sunnah', priority: true });
      }

      if (dow === 5) {
        events.push({ title: 'Hari Jumat · Sunah Surah Al-Kahfi & Perbanyak Selawat', type: 'sunnah', priority: false });
      } else if (dow === 1) {
        events.push({ title: 'Puasa Sunnah Hari Senin', type: 'sunnah', priority: false });
      } else if (dow === 4) {
        events.push({ title: 'Puasa Sunnah Hari Kamis', type: 'sunnah', priority: false });
      }

      return events;
    }

    function renderKalender(animateEnter = false) {
      const [selY, selM, selD] = calSelectedDateStr.split('-').map(Number);
      const selectedDate = new Date(selY, selM - 1, selD);
      const selHari = HARI_FULL[selectedDate.getDay()];
      const selPasaran = getPasaranJawa(selectedDate);
      const selHijri = getHijriDate(selectedDate);
      const neptuTotal = (NEPTU_HARI[selHari] || 0) + (NEPTU_PASARAN[selPasaran] || 0);
      const selectedEvents = getDateEvents(selectedDate, selHijri);

      const firstDayOfMonth = new Date(calViewYear, calViewMonth, 1).getDay();
      const daysInMonth = new Date(calViewYear, calViewMonth + 1, 0).getDate();

      const firstHijri = getHijriDate(new Date(calViewYear, calViewMonth, 1));
      const lastHijri = getHijriDate(new Date(calViewYear, calViewMonth, daysInMonth));
      const hijriRangeLabel = firstHijri.monthName === lastHijri.monthName
        ? `${firstHijri.monthName} ${firstHijri.year} H`
        : `${firstHijri.monthName} – ${lastHijri.monthName} ${lastHijri.year} H`;

      const monthlyHighlights = [];
      let cellsHtml = '';

      for (let i = 0; i < firstDayOfMonth; i++) {
        cellsHtml += `<div class="min-h-[82px] sm:min-h-[90px] rounded-2xl opacity-20" style="background-color: var(--md-surface-container);"></div>`;
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const dObj = new Date(calViewYear, calViewMonth, day);
        const dow = dObj.getDay();
        const pasaran = getPasaranJawa(dObj);
        const hijri = getHijriDate(dObj);
        const dateStr = `${calViewYear}-${String(calViewMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const dayEvents = getDateEvents(dObj, hijri);

        dayEvents.forEach(ev => {
          if (ev.priority || dow === 5) {
            monthlyHighlights.push({
              dateStr,
              day,
              hari: HARI_FULL[dow],
              pasaran,
              hijriText: `${hijri.day} ${hijri.monthName} ${hijri.year} H`,
              title: ev.title,
              type: ev.type
            });
          }
        });

        const isSelected = dateStr === calSelectedDateStr;
        const isToday = dateStr === TODAY_ISO;
        const isSunday = dow === 0;
        const isFriday = dow === 5;
        const hasNasional = dayEvents.some(e => e.type === 'nasional');
        const hasIslam = dayEvents.some(e => e.type === 'islam');
        const hasSunnah = dayEvents.some(e => e.type === 'sunnah' && e.priority);

        let cardStyle = 'background-color: var(--md-surface); border-color: var(--md-outline);';
        if (isSelected) {
          cardStyle = 'background-color: var(--md-primary); color: var(--md-on-primary); border-color: var(--md-primary); box-shadow: 0 6px 14px -4px rgba(0,0,0,0.2);';
        } else if (isToday) {
          cardStyle = 'background-color: var(--md-primary-container); color: var(--md-on-primary-container); border-color: var(--md-primary);';
        } else if (isFriday) {
          cardStyle = 'background-color: var(--md-tertiary-container); color: var(--md-on-tertiary-container); border-color: transparent;';
        }

        const redAccent = !isSelected && (isSunday || hasNasional);

        cellsHtml += `
          <button onclick="selectCalendarDate('${dateStr}')"
                  class="min-h-[82px] sm:min-h-[90px] p-1.5 sm:p-2 rounded-2xl border flex flex-col justify-between transition active:scale-95 relative overflow-hidden"
                  style="${cardStyle}">
            <div class="w-full flex items-center justify-between leading-none">
              <div class="flex items-center gap-0.5">
                ${hasNasional ? `<span class="w-1.5 h-1.5 rounded-full ${isSelected ? 'bg-white' : 'bg-rose-500'}"></span>` : ''}
                ${hasIslam ? `<span class="w-1.5 h-1.5 rounded-full ${isSelected ? 'bg-white' : 'bg-emerald-500'}"></span>` : ''}
                ${hasSunnah ? `<span class="w-1.5 h-1.5 rounded-full ${isSelected ? 'bg-white' : 'bg-amber-500'}"></span>` : ''}
              </div>
              <span class="text-[10px] font-extrabold ${isSelected ? 'opacity-95' : 'opacity-75'}">
                ${hijri.day}
              </span>
            </div>

            <div class="w-full text-center text-lg sm:text-xl font-extrabold leading-none my-1 ${redAccent ? 'text-rose-500' : ''}">
              ${day}
            </div>

            <div class="w-full text-center text-[9.5px] sm:text-[10px] font-bold tracking-tight truncate ${isSelected ? 'opacity-95' : 'opacity-80'}">
              ${pasaran}
            </div>
          </button>
        `;
      }

      return `
        <div class="p-3 sm:p-4 space-y-4 ${animateEnter ? 'md-page-enter' : ''}">
          <!-- 1. KALENDER BULANAN -->
          <section class="rounded-[28px] p-3.5 sm:p-4 border space-y-3.5 shadow-xs"
                   style="background-color: var(--md-surface); border-color: var(--md-outline);">
            <div class="flex items-center justify-between gap-2">
              <div class="flex items-center gap-2">
                <button onclick="changeCalendarMonth(-1)" aria-label="Bulan Sebelumnya"
                        class="w-10 h-10 rounded-full flex items-center justify-center font-extrabold text-lg active:scale-90 transition"
                        style="background-color: var(--md-surface-container); color: var(--md-text);">
                  ‹
                </button>
                <div>
                  <h1 class="text-lg sm:text-xl font-extrabold leading-tight">
                    ${BULAN_FULL[calViewMonth]} ${calViewYear}
                  </h1>
                  <div class="text-xs font-bold" style="color: var(--md-primary);">
                    ${hijriRangeLabel}
                  </div>
                </div>
              </div>

              <div class="flex items-center gap-1.5">
                <button onclick="jumpToTodayCalendar()"
                        class="px-3.5 py-2 rounded-full text-xs font-extrabold active:scale-95 transition"
                        style="background-color: var(--md-primary-container); color: var(--md-on-primary-container);">
                  Hari Ini
                </button>
                <button onclick="changeCalendarMonth(1)" aria-label="Bulan Berikutnya"
                        class="w-10 h-10 rounded-full flex items-center justify-center font-extrabold text-lg active:scale-90 transition"
                        style="background-color: var(--md-surface-container); color: var(--md-text);">
                  ›
                </button>
              </div>
            </div>

            <div class="grid grid-cols-7 gap-1.5 text-center py-2 rounded-2xl"
                 style="background-color: var(--md-surface-container);">
              ${HARI_SHORT.map((hName, idx) => `
                <div class="text-xs font-extrabold ${idx === 0 ? 'text-rose-500' : (idx === 5 ? 'text-emerald-600' : '')}">
                  ${hName}
                </div>
              `).join('')}
            </div>

            <div class="grid grid-cols-7 gap-1.5">
              ${cellsHtml}
            </div>

            <div class="pt-2.5 border-t flex flex-wrap items-center justify-between gap-2 text-[10.5px] font-bold px-1"
                 style="border-color: var(--md-outline); color: var(--md-text-muted);">
              <div class="flex items-center gap-3 flex-wrap">
                <span class="inline-flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-emerald-500"></span> Hari Besar Islam</span>
                <span class="inline-flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-amber-500"></span> Puasa Sunnah</span>
                <span class="inline-flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-rose-500"></span> Libur Nasional</span>
              </div>
              <span>Pojok kanan: Tgl Hijriyah</span>
            </div>
          </section>

          <!-- 2. DETAIL TANGGAL TERPILIH -->
          <section class="rounded-[28px] p-5 space-y-3.5 transition-colors"
                   style="background-color: var(--md-primary-container); color: var(--md-on-primary-container);">
            <div class="flex items-start justify-between gap-3">
              <div>
                <div class="text-[11px] font-extrabold uppercase tracking-wider opacity-75">
                  DETAIL TANGGAL TERPILIH
                </div>
                <h2 class="text-xl font-extrabold leading-snug mt-0.5">
                  ${selHari} ${selPasaran}, ${selD} ${BULAN_FULL[selM - 1]} ${selY}
                </h2>
                <p class="text-sm font-bold mt-0.5" style="color: var(--md-primary);">
                  ${selHijri.day} ${selHijri.monthName} ${selHijri.year} H
                </p>
              </div>

              <div class="px-3.5 py-2 rounded-2xl text-center shrink-0"
                   style="background-color: var(--md-surface); color: var(--md-text);">
                <div class="text-[10px] font-extrabold uppercase opacity-65">Neptu</div>
                <div class="text-base font-extrabold" style="color: var(--md-primary);">${neptuTotal}</div>
              </div>
            </div>

            <div class="space-y-2 pt-2 border-t" style="border-color: rgba(0,0,0,0.08);">
              ${selectedEvents.length > 0 ? selectedEvents.map(ev => {
                const badgeIcon = ev.type === 'nasional' ? '🇮🇩' : (ev.type === 'islam' ? '🌙' : '✨');
                return `
                  <div class="p-3 rounded-2xl flex items-center gap-2.5 text-xs font-extrabold"
                       style="background-color: var(--md-surface); color: var(--md-text);">
                    <span class="text-base">${badgeIcon}</span>
                    <span>${ev.title}</span>
                  </div>
                `;
              }).join('') : `
                <div class="p-3 rounded-2xl text-xs font-semibold opacity-80"
                     style="background-color: var(--md-surface); color: var(--md-text-muted);">
                  Tidak ada catatan hari besar khusus pada tanggal ini.
                </div>
              `}
            </div>
          </section>

          <!-- 3. DAFTAR HARI PENTING BULAN INI -->
          <section class="rounded-[28px] p-4 border space-y-3"
                   style="background-color: var(--md-surface); border-color: var(--md-outline);">
            <div class="flex items-center justify-between">
              <h3 class="text-sm font-extrabold">Hari Penting & Amalan Bulan Ini</h3>
              <span class="text-[11px] font-extrabold px-2.5 py-0.5 rounded-full"
                    style="background-color: var(--md-surface-container); color: var(--md-primary);">
                ${monthlyHighlights.length} agenda
              </span>
            </div>

            <div class="space-y-2">
              ${monthlyHighlights.map(item => {
                const isSelected = item.dateStr === calSelectedDateStr;
                const dotColor = item.type === 'nasional' ? 'bg-rose-500' : (item.type === 'islam' ? 'bg-emerald-500' : 'bg-amber-500');
                return `
                  <button onclick="selectCalendarDate('${item.dateStr}')"
                          class="w-full p-3 rounded-2xl flex items-center justify-between gap-3 text-left transition active:scale-98"
                          style="${isSelected
                            ? 'background-color: var(--md-primary-container); color: var(--md-on-primary-container);'
                            : 'background-color: var(--md-surface-container);'}">
                    <div class="flex items-center gap-3 min-w-0">
                      <div class="w-11 h-11 rounded-2xl flex flex-col items-center justify-center shrink-0 font-extrabold"
                           style="background-color: var(--md-surface); color: var(--md-text);">
                        <span class="text-sm leading-none">${item.day}</span>
                        <span class="text-[9px] opacity-70 mt-0.5">${BULAN_SHORT[calViewMonth]}</span>
                      </div>
                      <div class="min-w-0">
                        <div class="text-xs font-extrabold truncate flex items-center gap-1.5">
                          <span class="w-2 h-2 rounded-full shrink-0 ${dotColor}"></span>
                          <span class="truncate">${item.title}</span>
                        </div>
                        <div class="text-[11px] opacity-75 mt-0.5">
                          ${item.hari} ${item.pasaran} · ${item.hijriText}
                        </div>
                      </div>
                    </div>
                    <span class="text-sm font-bold opacity-50 shrink-0">›</span>
                  </button>
                `;
              }).join('')}
            </div>
          </section>
        </div>
      `;
    }

    function changeCalendarMonth(delta) {
      calViewMonth += delta;
      if (calViewMonth < 0) {
        calViewMonth = 11;
        calViewYear -= 1;
      } else if (calViewMonth > 11) {
        calViewMonth = 0;
        calViewYear += 1;
      }
      renderApp();
    }

    function selectCalendarDate(dateStr) {
      calSelectedDateStr = dateStr;
      renderApp();
    }

    function jumpToTodayCalendar() {
      calViewYear = 2026;
      calViewMonth = 10;
      calSelectedDateStr = TODAY_ISO;
      renderApp();
      showToast('Kembali ke hari ini: Selasa Pahing, 24 Nov 2026');
    }

    // =========================================================================
    // 9. TAB 4: TAMPILAN & IKON (INLINE SVG LANGSUNG TAMPIL)
    // =========================================================================

              <div class="flex flex-col items-center gap-1.5 shrink-0">
                <div class="w-16 h-16 flex items-center justify-center transition-all duration-300">

                </div>
                <span class="text-[11px] font-extrabold tracking-tight">Routines</span>
              </div>

              <div class="flex-1 space-y-2">
                <div class="text-xs font-extrabold">Gaya Ikon Layar Utama</div>
                <div class="grid grid-cols-3 gap-1.5">
                  ${APP_ICON_VARIANTS.map(v => {
                    const active = state.appIconVariant === v.id;

                      <button onclick="setAppIconVariant('${v.id}')"

          <section class="rounded-[28px] p-4 border space-y-3"
                   style="background-color: var(--md-surface); border-color: var(--md-outline);">
            <div class="flex items-center justify-between">
              <h2 class="text-sm font-extrabold">Mode Tema Material You</h2>
              <span class="text-[11px] font-bold px-2.5 py-0.5 rounded-full"
                    style="background-color: var(--md-primary-container); color: var(--md-on-primary-container);">
                Dynamic M3
              </span>
            </div>

            <div class="grid grid-cols-3 gap-2">
              ${[

              ].map(m => `

                        style="${state.themeMode === m.id

            <div class="pt-3 border-t space-y-2.5" style="border-color: var(--md-outline);">

    function setAppIconVariant(variant) {

    function setThemeMode(mode) {
      state.themeMode = mode;
      saveState();
      applyMaterialTheme();
      renderApp();
    }

    function setAccentColor(hex) {
      state.accentColor = hex;
      saveState();
      applyMaterialTheme();
      renderApp();
    }

    function setIconPack(packKey) {
      state.iconPack = packKey;
      saveState();
      updateNavUI();
      renderApp();
      showToast(`Paket ikon diubah: ${ICON_PACKS[packKey].name}`);
    }

    function downloadPwaFile(filename) {
      let content = '';
      if (filename === 'manifest.json') {
        content = JSON.stringify({
          name: "Routines — Tilawah, Tasbih & Kalender",
          short_name: "Routines",
          description: "Aplikasi Tilawah, Tasbih Digital Privat, dan Kalender Masehi-Hijriyah-Jawa bergaya Material You",
          start_url: "./index.html",
          display: "standalone",
          background_color: currentThemeTokens.bg,
          theme_color: state.accentColor,
          icons: [
            {
              src: "./icon-512.png",
              sizes: "512x512",
              type: "image/png",
              purpose: "any maskable"
            }
          ]
        }, null, 2);
      } else {
        content = `const CACHE_NAME = 'routines-pwa-v1';
const ASSETS = ['./', './index.html', './manifest.json', './icon-512.png'];
self.addEventListener('install', e => {
  e.waitUntil(caches.open(CACHE_NAME).then(c => c.addAll(ASSETS)));
});
self.addEventListener('fetch', e => {
  e.respondWith(caches.match(e.request).then(r => r || fetch(e.request)));
});`;
      }
      const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
      showToast(`File ${filename} berhasil diunduh!`);
    }

    // =========================================================================
    // 10. MODAL DIALOGS
    // =========================================================================
    function openModal(html) {
      document.getElementById('modalBox').innerHTML = html;
      document.getElementById('modalOverlay').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.add('hidden');
    }

    function openEditPositionModal() {
      const t = state.tilawah;
      openModal(`
        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <h3 class="text-base font-extrabold">Edit Posisi Terakhir</h3>
            <button onclick="closeModal()" class="w-8 h-8 rounded-full font-bold" style="background-color: var(--md-surface-container);">✕</button>
          </div>
          <div class="space-y-3 text-xs">
            <div>
              <label class="font-bold block mb-1">Nama Surah</label>
              <input id="inpSurah" type="text" value="${t.surahName}" class="w-full p-3 rounded-2xl border font-semibold"
                     style="background-color: var(--md-surface-container); border-color: var(--md-outline);" />
            </div>
            <div class="grid grid-cols-3 gap-2">
              <div>
                <label class="font-bold block mb-1">Ayat ke-</label>
                <input id="inpAyah" type="number" min="1" value="${t.ayahNum}" class="w-full p-3 rounded-2xl border font-semibold"
                       style="background-color: var(--md-surface-container); border-color: var(--md-outline);" />
              </div>
              <div>
                <label class="font-bold block mb-1">Halaman (1-604)</label>
                <input id="inpPage" type="number" min="1" max="604" value="${t.totalPages}" class="w-full p-3 rounded-2xl border font-semibold"
                       style="background-color: var(--md-surface-container); border-color: var(--md-outline);" />
              </div>
              <div>
                <label class="font-bold block mb-1">Juz (1-30)</label>
                <input id="inpJuz" type="number" min="1" max="30" value="${t.juzNum}" class="w-full p-3 rounded-2xl border font-semibold"
                       style="background-color: var(--md-surface-container); border-color: var(--md-outline);" />
              </div>
            </div>
            <button onclick="saveEditPosition()" class="w-full py-3 rounded-full font-extrabold text-xs mt-2"
                    style="background-color: var(--md-primary); color: var(--md-on-primary);">
              Simpan Posisi Bacaan
            </button>
          </div>
        </div>
      `);
    }

    function saveEditPosition() {
      const surah = document.getElementById('inpSurah').value.trim() || "Al-Baqarah";
      const ayah = Math.max(1, Number(document.getElementById('inpAyah').value) || 1);
      const page = Math.min(604, Math.max(1, Number(document.getElementById('inpPage').value) || 1));
      const juz = Math.min(30, Math.max(1, Number(document.getElementById('inpJuz').value) || Math.ceil(page / 20)));

      state.tilawah.surahName = surah;
      state.tilawah.ayahNum = ayah;
      state.tilawah.totalPages = page;
      state.tilawah.juzNum = juz;
      saveState();
      closeModal();
      renderApp();
      showToast('Posisi tilawah diperbarui');
    }

    function openDzikirPickerModal() {
      const ts = state.tasbih;
      openModal(`
        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <h3 class="text-base font-extrabold">Pilih / Tulis Bacaan Zikir</h3>
            <button onclick="closeModal()" class="w-8 h-8 rounded-full font-bold" style="background-color: var(--md-surface-container);">✕</button>
          </div>

          <div class="space-y-2 text-xs">
            <input id="customDzikirLabel" type="text" value="${ts.label}" placeholder="Nama bacaan (misal: Shalawat Jibril)"
                   class="w-full p-3 rounded-2xl border font-semibold"
                   style="background-color: var(--md-surface-container); border-color: var(--md-outline);" />
            <input id="customDzikirArab" type="text" value="${ts.arab}" placeholder="Teks Arab (opsional)"
                   class="w-full p-3 rounded-2xl border font-arab text-lg text-right"
                   style="background-color: var(--md-surface-container); border-color: var(--md-outline);" />
            <button onclick="applyCustomDzikir()" class="w-full py-2.5 rounded-full font-extrabold"
                    style="background-color: var(--md-primary); color: var(--md-on-primary);">
              Gunakan Teks Zikir Ini
            </button>
          </div>

          <div class="space-y-2 pt-2 border-t" style="border-color: var(--md-outline);">
            <div class="text-[11px] font-extrabold uppercase tracking-wider" style="color: var(--md-text-muted);">Pilihan Zikir Cepat</div>
            ${DZIKIR_PRESETS.map(d => `
              <button onclick="selectPresetDzikir('${d.id}')" class="w-full p-3 rounded-2xl flex items-center justify-between text-left"
                      style="background-color: var(--md-surface-container);">
                <div>
                  <div class="text-xs font-extrabold">${d.label}</div>
                  <div class="text-[10px]" style="color: var(--md-text-muted);">Target: ${d.target}x</div>
                </div>
                <span class="font-arab text-xl font-bold" style="color: var(--md-primary);">${d.arab}</span>
              </button>
            `).join('')}
          </div>
        </div>
      `);
    }

    function applyCustomDzikir() {
      state.tasbih.label = document.getElementById('customDzikirLabel').value.trim() || 'Dzikir Harian';
      state.tasbih.arab = document.getElementById('customDzikirArab').value.trim() || 'ذِكْرُ اللّٰهِ';
      saveState();
      closeModal();
      renderApp();
    }

    function selectPresetDzikir(id) {
      const found = DZIKIR_PRESETS.find(d => d.id === id);
      if (!found) return;
      state.tasbih.label = found.label;
      state.tasbih.arab = found.arab;
      state.tasbih.target = found.target;
      state.tasbih.count = 0;
      saveState();
      closeModal();
      renderApp();
    }

    function openTargetTasbihModal() {
      openModal(`
        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <h3 class="text-base font-extrabold">Target Hitungan per Putaran</h3>
            <button onclick="closeModal()" class="w-8 h-8 rounded-full font-bold" style="background-color: var(--md-surface-container);">✕</button>
          </div>
          <div class="grid grid-cols-4 gap-2">
            ${[33, 99, 100, 1000].map(val => `
              <button onclick="setTasbihTarget(${val})" class="py-3 rounded-2xl font-extrabold text-xs"
                      style="${state.tasbih.target === val ? 'background-color: var(--md-primary); color: var(--md-on-primary);' : 'background-color: var(--md-primary-container); color: var(--md-on-primary-container);'}">
                ${val}
              </button>
            `).join('')}
          </div>
          <div class="flex gap-2">
            <input id="customTargetInp" type="number" min="1" placeholder="Angka target bebas..."
                   class="flex-1 p-3 rounded-2xl border text-xs font-semibold"
                   style="background-color: var(--md-surface-container); border-color: var(--md-outline);" />
            <button onclick="setTasbihTarget(Number(document.getElementById('customTargetInp').value) || 33)"
                    class="px-5 py-3 rounded-full text-xs font-extrabold"
                    style="background-color: var(--md-primary); color: var(--md-on-primary);">
              Simpan
            </button>
          </div>
        </div>
      `);
    }

    function openTasbihSettingsModal() {
      const ts = state.tasbih;
      openModal(`
        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <h3 class="text-base font-extrabold">Pengaturan Cepat Tasbih</h3>
            <button onclick="closeModal()" class="w-8 h-8 rounded-full font-bold" style="background-color: var(--md-surface-container);">✕</button>
          </div>

          <div class="space-y-2.5 text-xs">
            <button onclick="toggleTasbihStealthBlack(); closeModal();" class="w-full p-3.5 rounded-2xl flex items-center justify-between font-extrabold"
                    style="background-color: var(--md-surface-container);">
              <span>Mode Hitam Pekat (OLED True Black)</span>
              <span style="color: var(--md-primary);">${ts.stealthBlack ? 'AKTIF' : 'MATI'}</span>
            </button>

            <button onclick="toggleTapAnywhere(); closeModal();" class="w-full p-3.5 rounded-2xl flex items-center justify-between font-extrabold"
                    style="background-color: var(--md-surface-container);">
              <span>Ketuk Di Mana Saja (Tap Anywhere)</span>
              <span style="color: var(--md-primary);">${ts.tapAnywhere ? 'AKTIF' : 'MATI'}</span>
            </button>

            <button onclick="toggleTasbihVibrate(); closeModal();" class="w-full p-3.5 rounded-2xl flex items-center justify-between font-extrabold"
                    style="background-color: var(--md-surface-container);">
              <span>Getar Umpan Balik</span>
              <span style="color: var(--md-primary);">${ts.vibrate ? 'AKTIF' : 'MATI'}</span>
            </button>

            <button onclick="openTargetTasbihModal()" class="w-full p-3.5 rounded-2xl flex items-center justify-between font-extrabold"
                    style="background-color: var(--md-primary-container); color: var(--md-on-primary-container);">
              <span>Ubah Target Putaran</span>
              <span>${ts.target}x ›</span>
            </button>

            <button onclick="state.tasbih.count=0; state.tasbih.rounds=0; state.tasbih.total=0; saveState(); closeModal(); renderApp(); showToast('Semua riwayat tasbih di-reset');"
                    class="w-full p-3 rounded-2xl font-extrabold text-rose-500 text-center"
                    style="background-color: var(--md-surface-container);">
              Reset Semua Total & Rounds
            </button>
          </div>
        </div>
      `);
    }

    function setTasbihTarget(val) {
      state.tasbih.target = Math.max(1, val);
      saveState();
      closeModal();
      renderApp();
      showToast(`Target tasbih: ${state.tasbih.target}x`);
    }

    // =========================================================================
    // 11. RENDER CONTROLLER & WINDOW ONLOAD
    // =========================================================================
    function triggerElementAnimation(elId, animClass) {
      const el = document.getElementById(elId);
      if (!el) return;
      el.classList.remove(animClass);
      void el.offsetWidth;
      el.classList.add(animClass);
    }

    function renderApp(animateEnter = false) {
      const vp = document.getElementById('viewport');
      if (state.activeTab === 'tilawah') {
        vp.innerHTML = renderTilawah(animateEnter);
      } else if (state.activeTab === 'tasbih') {
        vp.innerHTML = renderTasbih(animateEnter);
      } else if (state.activeTab === 'kalender') {
        vp.innerHTML = renderKalender(animateEnter);
      } else {
        vp.innerHTML = renderTampilan(animateEnter);
      }
      updateNavUI();
    }

    window.onload = function () {
      applyMaterialTheme();
      renderApp(true);
    };
  </script>
</body>
</html>
